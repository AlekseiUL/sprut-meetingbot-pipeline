# Updates are proposals. Review and passing CI are required; no auto-merge.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    actions-compatible:
      patterns: ['*']
      update-types: [minor, patch]
- package-ecosystem: npm
  directory: /backend
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  groups:
    typescript-eslint:
      patterns: ['@typescript-eslint/*']
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
