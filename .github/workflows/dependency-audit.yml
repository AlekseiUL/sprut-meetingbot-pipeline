name: Dependency audit
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned advisory client
        run: python -m pip install pip-audit==2.10.1
      - name: Audit fully pinned dependency snapshot
        run: pip-audit --strict --disable-pip --no-deps -r requirements-audit.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Audit npm production and development lockfile at every severity
        working-directory: backend
        run: npm audit --audit-level=low
