name: Container build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [development, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build only; never start the recording service
        run: docker build --progress=plain --file backend/Dockerfile.${{ matrix.variant }} --tag meetingbot-offline:${{ matrix.variant }} backend
